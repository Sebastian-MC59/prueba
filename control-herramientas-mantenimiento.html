<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de herramientas y mantenimiento</title>
<!-- Favicon incrustado: evita que el navegador pida /favicon.ico (error 404) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313213A'/%3E%3Cpath d='M20.5 7.5a5 5 0 0 0-6.6 6.3l-6 6a2 2 0 0 0 2.8 2.8l6-6a5 5 0 0 0 6.3-6.6l-2.9 2.9-2.4-.4-.4-2.4z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
/* =========================================================
   Control de herramientas y mantenimiento
   Un solo archivo, sin recursos externos.
   ========================================================= */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --surface-2: #F5F7FA;
  --text: #13213A; --text-2: #56657B;
  --border: #D7DEE7; --border-strong: #B9C4D2;
  --ink: #13213A; --ink-hover: #22355A;
  --y1: #0B7A75; --y1-soft: #E0F2F0;
  --y2: #4352C9; --y2-soft: #E7E9FA;
  --ok: #1E7A4C; --ok-bg: #E2F3E9;
  --info: #22609F; --info-bg: #E2ECF7;
  --warn: #8F5600; --warn-bg: #FCEFD6;
  --danger: #B42F2A; --danger-bg: #FBE6E4;
  --muted: #5C6B7E; --muted-bg: #EAEEF2;
  --mark: #FFE58A;
  --focus: 0 0 0 3px rgba(11, 122, 117, .4);
  --shadow: 0 24px 60px rgba(15, 25, 45, .28);
  --r-s: 5px; --r-m: 8px; --r-l: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1520; --surface: #172030; --surface-2: #1E293B; --text: #E5EAF2; --text-2: #9AA8BC;
    --border: #2B3850; --border-strong: #3C4B66; --ink: #DCE5F2; --ink-hover: #FFFFFF;
    --y1: #3CC2B9; --y1-soft: #12302F; --y2: #8D98F2; --y2-soft: #1F2448;
    --ok: #63C891; --ok-bg: #15322A; --info: #7DB0EA; --info-bg: #172A3F;
    --warn: #EDB257; --warn-bg: #3A2B12; --danger: #F2786E; --danger-bg: #3D1C1A;
    --muted: #9AA8B8; --muted-bg: #263142; --mark: #7A6512;
    --shadow: 0 24px 60px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
.i { width: 18px; height: 18px; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-2); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-s); }
[hidden] { display: none !important; }

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 28px 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-m); background: var(--ink); color: var(--surface); flex: none; }
.brand-mark .i { width: 22px; height: 22px; }
.brand strong { display: block; font-size: 1.05rem; line-height: 1.2; }
.brand small { display: block; color: var(--text-2); font-size: .82rem; }
.data-menu { position: relative; }
.data-menu summary { list-style: none; }
.data-menu summary::-webkit-details-marker { display: none; }
.data-menu-body {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 230px;
  display: flex; flex-direction: column; padding: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-m); box-shadow: var(--shadow);
}
.data-menu-body button, .data-menu-body label {
  text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: var(--r-s); cursor: pointer;
}
.data-menu-body button:hover, .data-menu-body label:hover { background: var(--surface-2); }
.danger-text { color: var(--danger) !important; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--r-m);
  font-weight: 600; cursor: pointer; white-space: nowrap; background: none; text-decoration: none;
}
.btn .i { width: 17px; height: 17px; }
.btn-primary { background: var(--ink); color: var(--surface); }
.btn-primary:hover { background: var(--ink-hover); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-2); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: #C0362F; color: #fff; }
.btn-small { min-height: 34px; padding: 0 12px; font-size: .88rem; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; background: none; border: 0; border-radius: var(--r-m); color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.del:hover { background: var(--danger-bg); color: var(--danger); }
.link-btn { background: none; border: 0; padding: 2px 0; color: var(--y1); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Contenido ---------- */
main { max-width: 1400px; margin: 0 auto; padding: 26px 28px 40px; }
.page-head { margin-bottom: 18px; }
.page-head h1 { font-size: 1.9rem; font-weight: 750; letter-spacing: -.015em; }
.page-head p { margin-top: 4px; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi {
  display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l); border-left: 5px solid var(--border-strong);
}
.kpi:hover { border-color: var(--border-strong); }
.kpi.ok { border-left-color: var(--ok); } .kpi.warn { border-left-color: #E0A12A; }
.kpi.danger { border-left-color: var(--danger); } .kpi.info { border-left-color: var(--info); }
.kpi.alert { background: var(--danger-bg); }
.kpi-label { color: var(--text-2); font-size: .88rem; font-weight: 500; }
.kpi-value { font-size: 2.1rem; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi.alert .kpi-value { color: var(--danger); }

/* ---------- Buscador y filtros ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 12px; margin-bottom: 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l);
}
.search {
  flex: 1 1 300px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px;
  background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 22px;
}
.search:focus-within { box-shadow: var(--focus); border-color: var(--y1); background: var(--surface); }
.search .i { color: var(--text-2); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; }
.search input:focus-visible { box-shadow: none; }
.toolbar select { height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-m); }
.toolbar select:focus { outline: none; box-shadow: var(--focus); border-color: var(--y1); }
.result-count { color: var(--text-2); font-size: .9rem; margin-left: auto; padding: 0 4px; }

/* ---------- Contenedores por año ---------- */
.years { display: grid; gap: 20px; }
.year { --yc: var(--y1); --ys: var(--y1-soft); background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--yc); border-radius: var(--r-l); overflow: hidden; }
.year.alt { --yc: var(--y2); --ys: var(--y2-soft); }
.year-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 20px; background: var(--ys); border-bottom: 1px solid var(--border); }
.year-num { font-size: 3.2rem; font-weight: 800; line-height: .9; letter-spacing: -.04em; color: var(--yc); font-variant-numeric: tabular-nums; }
.year-stats { display: flex; flex-wrap: wrap; margin: 0; flex: 1 1 auto; }
.year-stats div { padding: 0 16px; border-left: 1px solid color-mix(in srgb, var(--yc) 30%, transparent); }
.year-stats div:first-child { padding-left: 0; border-left: 0; }
.year-stats dt { font-size: .8rem; color: var(--text-2); }
.year-stats dd { margin: 0; font-size: 1.3rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.year-empty { padding: 36px 20px; text-align: center; color: var(--text-2); }
.year-empty .btn { margin-top: 12px; }

.table-wrap { overflow-x: auto; }
table.records { width: 100%; border-collapse: collapse; }
.records th { text-align: left; font-size: .82rem; font-weight: 600; color: var(--text-2); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); }
.records td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.records tbody tr:last-child td { border-bottom: 0; }
.records tbody tr:hover { background: var(--surface-2); }
.records td small { display: block; color: var(--text-2); font-size: .82rem; margin-top: 1px; }
.records .nowrap { white-space: nowrap; }
.records .cap { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.records .actions { text-align: right; white-space: nowrap; width: 80px; }
.code { display: inline-block; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: .88rem; letter-spacing: .02em; white-space: nowrap; }
.row-late td:first-child { box-shadow: inset 4px 0 0 var(--danger); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 12px; font-size: .8rem; font-weight: 650; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.plain::before { content: none; }
.t-ok { color: var(--ok); background: var(--ok-bg); }
.t-info { color: var(--info); background: var(--info-bg); }
.t-warn { color: var(--warn); background: var(--warn-bg); }
.t-danger { color: var(--danger); background: var(--danger-bg); }
.t-muted { color: var(--muted); background: var(--muted-bg); }

/* ---------- Modal y formulario ---------- */
#modal-root { display: none; }
#modal-root.open { display: grid; place-items: center; position: fixed; inset: 0; z-index: 50; padding: 16px; }
.backdrop { position: absolute; inset: 0; background: rgba(12, 20, 36, .55); }
.modal { position: relative; width: 100%; min-width: 0; max-width: 760px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); animation: rise .16s ease-out; }
.modal.sm { max-width: 440px; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.modal form { display: flex; flex-direction: column; min-height: 0; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 22px 6px; }
.modal-head h2 { font-size: 1.4rem; }
.modal-body { padding: 12px 22px 6px; overflow-y: auto; display: grid; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 20px; border-top: 1px solid var(--border); margin-top: 10px; }
.form-error { margin: 6px 22px 0; padding: 10px 12px; border-radius: var(--r-m); background: var(--danger-bg); color: var(--danger); font-weight: 500; }

.section { min-width: 0; margin: 0; padding: 14px 16px 16px; border: 1px solid var(--border); border-radius: var(--r-l); }
.section legend { font-weight: 700; padding: 0 6px; margin-left: -6px; }
.section.equipo { background: var(--surface-2); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-weight: 600; font-size: .9rem; }
.hint { color: var(--text-2); font-size: .82rem; }
.field input, .field select, .field textarea, .cap-grupo input, .cap-grupo select {
  height: 42px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-m); min-width: 0;
}
.field textarea { height: auto; padding: 10px 12px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .cap-grupo input:focus, .cap-grupo select:focus { outline: none; box-shadow: var(--focus); border-color: var(--y1); }
.code-input { text-transform: uppercase; font-weight: 700; letter-spacing: .02em; }
.code-input::placeholder { text-transform: none; font-weight: 400; letter-spacing: 0; }

/* Equipo específico y Capacidad en la misma fila */
.equipo-grid { display: grid; gap: 14px; }
.equipo-fila { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; }
.equipo-fila .especifico { flex: 1 1 260px; }
.equipo-fila .capacidad { flex: 0 1 260px; }
.cap-grupo { display: flex; gap: 6px; }
.cap-grupo input { flex: 1 1 auto; width: 100%; }
.cap-grupo select { flex: 0 0 auto; padding: 0 8px; }

/* ---------- Avisos ---------- */
#toast-root { position: fixed; z-index: 60; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { max-width: 380px; padding: 12px 16px; border-radius: var(--r-m); font-weight: 600; background: #13213A; color: #fff; box-shadow: var(--shadow); border-left: 4px solid #3CC2B9; transition: opacity .3s, transform .3s; animation: rise .16s ease-out; }
.toast.warn { border-left-color: #F0B33A; } .toast.danger { border-left-color: #E5544B; }
.toast.leaving { opacity: 0; transform: translateY(6px); }
.storage-note { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--r-m); background: var(--warn-bg); color: var(--warn); font-weight: 500; }

/* ---------- Adaptación a tableta y móvil ---------- */
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px) {
  .topbar { padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
  .brand small { display: none; }
  .topbar .btn span { display: none; }
  .topbar .btn { padding: 0 12px; }
  main { padding: 20px 16px 32px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .kpi:first-child { grid-column: 1 / -1; }
  .result-count { margin-left: 0; width: 100%; }
  .toolbar select { flex: 1 1 140px; }
}
@media (max-width: 760px) {
  .records thead { display: none; }
  .records, .records tbody, .records tr, .records td { display: block; width: 100%; }
  .records tr { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .records tbody tr:last-child { border-bottom: 0; }
  .records td { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 3px 0; border: 0; }
  .records td::before { content: attr(data-label); color: var(--text-2); font-size: .84rem; }
  .records td.actions { display: flex; justify-content: flex-start; gap: 4px; width: auto; padding-top: 8px; }
  .records td.actions::before { content: none; }
  .row-late td:first-child { box-shadow: none; }
  .row-late { box-shadow: inset 4px 0 0 var(--danger); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .equipo-fila .capacidad { flex-basis: 100%; }
  #modal-root.open { padding: 0; place-items: end center; }
  .modal { max-height: 94vh; border-radius: 14px 14px 0 0; }
  .modal-foot { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  .year-num { font-size: 2.6rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- Íconos SVG reutilizables -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.6 17.2a1.9 1.9 0 0 0 2.7 2.7l5.7-5.7a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.5-.5-2.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"><svg class="i"><use href="#i-tool"></use></svg></span>
    <div><strong>Control de herramientas</strong><small>Equipos, capacidad y mantenimiento</small></div>
  </div>
  <details class="data-menu">
    <summary class="btn btn-ghost"><svg class="i"><use href="#i-db"></use></svg><span>Datos</span></summary>
    <div class="data-menu-body">
      <button type="button" data-action="export">Exportar respaldo (JSON)</button>
      <label>Importar respaldo<input type="file" id="import-file" accept="application/json,.json" hidden></label>
      <button type="button" data-action="demo">Cargar datos de ejemplo</button>
      <button type="button" data-action="clear" class="danger-text">Borrar todos los datos</button>
    </div>
  </details>
  <button type="button" class="btn btn-primary" data-action="new"><svg class="i"><use href="#i-plus"></use></svg><span>Nuevo registro</span></button>
</header>

<main>
  <p class="storage-note" id="storage-note" hidden>Este navegador no permite guardar datos locales: los cambios se perderán al cerrar la página. Usa Exportar respaldo para conservarlos.</p>

  <section class="page-head">
    <h1>Panel de control</h1>
    <p class="muted" id="subtitle"></p>
  </section>

  <section class="kpis" id="kpis" aria-label="Resumen"></section>

  <section class="toolbar" aria-label="Buscador y filtros">
    <label class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
      <span class="sr-only">Buscar</span>
      <input id="f-q" type="search" autocomplete="off" placeholder="Buscar por código, equipo, capacidad, responsable o ubicación">
    </label>
    <label><span class="sr-only">Año</span><select id="f-year"></select></label>
    <label><span class="sr-only">Categoría</span><select id="f-cat"></select></label>
    <label><span class="sr-only">Estado</span><select id="f-estado"></select></label>
    <label><span class="sr-only">Tipo</span><select id="f-tipo"></select></label>
    <button type="button" class="link-btn" data-action="clear-filters" id="clear-filters" hidden>Limpiar filtros</button>
    <span class="result-count" id="result-count" aria-live="polite"></span>
  </section>

  <div class="years" id="years"></div>
</main>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
'use strict';

/* =========================================================
   1. CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  STORAGE_KEY: 'control-herramientas-mantenimiento.v1',
  YEARS: [2026, 2027],
  CATEGORIAS: {
    'Herramienta eléctrica': ['Taladro percutor', 'Esmeriladora angular', 'Rotomartillo', 'Sierra circular', 'Atornillador de impacto'],
    'Herramienta manual': ['Llave de torque', 'Juego de llaves', 'Juego de destornilladores', 'Prensa de banco'],
    'Medición': ['Multímetro', 'Pinza amperimétrica', 'Nivel láser', 'Pie de rey', 'Termómetro infrarrojo'],
    'Climatización': ['Chiller', 'Unidad manejadora (UMA)', 'Mini split', 'Equipo paquete', 'Condensadora'],

/* =========================================================
   2. UTILIDADES
   ========================================================= */
const U = {
  esc: v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  norm: v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(),
  uid: () => 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  yearOf: iso => Number(String(iso).slice(0, 4)),
  fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-').map(Number);
    return new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(y, m - 1, d));
  },
  fmtNum: n => new Intl.NumberFormat('es', { maximumFractionDigits: 2 }).format(n),
  fmtCap: r => (r.capacidad === null || r.capacidad === undefined || r.capacidad === '' ? '—' : `${U.fmtNum(r.capacidad)} ${r.unidad}`),
  plural: (n, one, many) => `${n} ${n === 1 ? one : many}`,
  debounce(fn, ms = 60) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  options: (list, selected) => list.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${U.esc(v)}"${String(v) === String(selected) ? ' selected' : ''}>${U.esc(l)}</option>`;
  }).join(''),
  // Todas las palabras de la búsqueda deben aparecer en algún campo (sin importar tildes ni mayúsculas)
  matches(query, fields) {
    const terms = U.norm(query).split(' ').filter(Boolean);
    if (!terms.length) return true;
    const hay = U.norm(fields.filter(f => f !== null && f !== undefined).join(' '));
    return terms.every(t => hay.includes(t));
  },
  // Resalta coincidencias respetando las tildes del texto original
  highlight(text, query) {
    const terms = U.norm(query).split(' ').filter(Boolean);
    const chars = [...String(text ?? '')];
    if (!terms.length) return U.esc(text);
    const flat = chars.map(c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().charAt(0) || c).join('');
    const mark = new Array(chars.length).fill(false);
    terms.forEach(t => { let i = flat.indexOf(t); while (i !== -1) { for (let k = i; k < i + t.length; k++) mark[k] = true; i = flat.indexOf(t, i + t.length); } });
    let out = '', open = false;
    chars.forEach((c, i) => {
      if (mark[i] && !open) { out += '<mark>'; open = true; }
      if (!mark[i] && open) { out += '</mark>'; open = false; }
      out += U.esc(c);
    });
    return open ? out + '</mark>' : out;
  },
  icon: name => `<svg class="i" aria-hidden="true"><use href="#i-${name}"></use></svg>`,
};

/* =========================================================
   3. ALMACENAMIENTO (localStorage con respaldo en memoria)
   ========================================================= */
const Storage = (() => {
  let available = true;
  let memory = null;
  try { const k = '__test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch { available = false; }
  return {
    available,
    load() {
      if (!available) return memory;
      try { const raw = localStorage.getItem(CONFIG.STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
    },
    save(data) {
      if (!available) { memory = data; return; }
      try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error('No se pudo guardar', e); }
    },
  };
})();

/* =========================================================
   5. ESTADO Y REGLAS DE NEGOCIO
   ========================================================= */
const Store = (() => {
  let records = [];

  function init() {
    const saved = Storage.load();
    records = Array.isArray(saved?.records) ? saved.records : demoRecords();
    if (!saved) persist();
  }
  const persist = () => Storage.save({ version: 1, records });
  const all = () => records;
  const get = id => records.find(r => r.id === id);
  const byYear = y => records.filter(r => U.yearOf(r.fecha) === y);
  const isLate = r => Boolean(r.proxima) && r.proxima < U.today() && r.estado !== 'Fuera de servicio';

  // Valida y limpia lo que llega del formulario
  function clean(v) {
    const fail = m => { throw new Error(m); };
    const fecha = String(v.fecha || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) fail('Indica la fecha del registro.');
    if (!CONFIG.YEARS.includes(U.yearOf(fecha))) fail(`La fecha debe estar dentro de ${CONFIG.YEARS.join(' o ')}.`);
    const codigo = String(v.codigo || '').trim().toUpperCase();
    if (!codigo) fail('Indica el código de la herramienta o equipo.');
    const especifico = String(v.especifico || '').trim();
    if (!especifico) fail('Indica el equipo específico.');

    const capRaw = String(v.capacidad ?? '').trim().replace(',', '.');
    let capacidad = null;
    if (capRaw !== '') {
      capacidad = Number(capRaw);
      if (!Number.isFinite(capacidad) || capacidad < 0) fail('La capacidad debe ser un número igual o mayor que 0.');
    }
    const proxima = v.proxima || null;
    if (proxima && proxima < fecha) fail('La próxima revisión no puede ser anterior a la fecha del registro.');

    return {
      fecha, codigo, especifico, capacidad,
      unidad: capacidad === null ? null : (CONFIG.UNIDADES.includes(v.unidad) ? v.unidad : CONFIG.UNIDADES[0]),
      categoria: CONFIG.CATEGORIAS[v.categoria] ? v.categoria : 'Otro',
      tipo: CONFIG.TIPOS.includes(v.tipo) ? v.tipo : CONFIG.TIPOS[0],
      estado: CONFIG.ESTADOS[v.estado] ? v.estado : 'Operativo',
      responsable: String(v.responsable || '').trim(),
      ubicacion: String(v.ubicacion || '').trim(),
      proxima,
      notas: String(v.notas || '').trim(),
    };
  }

  function save(values, id) {
    const data = clean(values);
    if (id) {
      const r = get(id);
      if (!r) throw new Error('El registro ya no existe.');
      Object.assign(r, data);
      persist();
      return r;
    }
    const r = { id: U.uid(), creado: U.today(), ...data };
    records.push(r);
    persist();
    return r;
  }

  function remove(id) { records = records.filter(r => r.id !== id); persist(); }
  function loadDemo() { records = demoRecords(); persist(); }
  function clearAll() { records = []; persist(); }
  const exportJSON = () => JSON.stringify({ version: 1, exportado: new Date().toISOString(), records }, null, 2);
  function importJSON(text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch { throw new Error('El archivo no es un JSON válido.'); }
    if (!Array.isArray(parsed?.records)) throw new Error('El archivo no tiene el formato de respaldo de esta app.');
    records = parsed.records.filter(r => r && r.id && r.fecha);
    persist();
  }
  // Conserva la sincronización si la app está abierta en dos pestañas
  window.addEventListener('storage', e => {
    if (e.key === CONFIG.STORAGE_KEY && e.newValue) {
      try { records = JSON.parse(e.newValue).records || []; App.render(); } catch { /* ignorar */ }
    }
  });

  return { init, all, get, byYear, isLate, save, remove, loadDemo, clearAll, exportJSON, importJSON };
})();

/* =========================================================
   6. INTERFAZ: modal, confirmación y avisos
   ========================================================= */
const UI = (() => {
  const root = document.getElementById('modal-root');
  let lastFocus = null;
  const onKey = e => { if (e.key === 'Escape') close(); };

  function close() {
    if (!root.classList.contains('open')) return;
    root.classList.remove('open');
    root.innerHTML = '';
    document.removeEventListener('keydown', onKey);
    document.body.classList.remove('no-scroll');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  function open({ title, body, submitLabel = 'Guardar', onSubmit, small = false, danger = false }) {
    if (!root.classList.contains('open')) lastFocus = document.activeElement;
    document.removeEventListener('keydown', onKey);
    root.innerHTML = `
      <div class="backdrop" data-close></div>
      <div class="modal${small ? ' sm' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <form novalidate>
          <header class="modal-head"><h2 id="modal-title">${title}</h2>
            <button type="button" class="icon-btn" data-close aria-label="Cerrar">${U.icon('x')}</button></header>
          <div class="modal-body">${body}</div>
          <p class="form-error" role="alert" hidden></p>
          <footer class="modal-foot">
            <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
            <button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${submitLabel}</button>
          </footer>
        </form>
      </div>`;
    root.classList.add('open');
    document.body.classList.add('no-scroll');
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    const form = root.querySelector('form');
    const err = root.querySelector('.form-error');
    form.addEventListener('submit', e => {
      e.preventDefault();
      try {
        onSubmit(Object.fromEntries(new FormData(form)));
        close();
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    });
    requestAnimationFrame(() => (form.querySelector('[autofocus]') || form.querySelector('input, select'))?.focus());
    return root.querySelector('.modal');
  }

  function confirm({ title, text, label = 'Confirmar', danger = true }) {
    return new Promise(resolve => {
      let ok = false;
      open({ title, body: `<p>${text}</p>`, submitLabel: label, small: true, danger, onSubmit: () => { ok = true; resolve(true); } });
      const obs = new MutationObserver(() => {
        if (!root.classList.contains('open')) { obs.disconnect(); if (!ok) resolve(false); }
      });
      obs.observe(root, { attributes: true, attributeFilter: ['class'] });
    });
  }

  function toast(msg, tone = '') {
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.classList.add('leaving'), 2800);
    setTimeout(() => el.remove(), 3200);
  }

  return { open, close, confirm, toast };
})();

/* =========================================================

   ========================================================= */
const App = (() => {
  const $ = id => document.getElementById(id);
  const filters = { q: '', year: '', cat: '', estado: '', tipo: '' };

  function setupFilters() {
    $('f-year').innerHTML = U.options([['', 'Todos los años'], ...CONFIG.YEARS.map(String)], '');
    $('f-cat').innerHTML = U.options([['', 'Todas las categorías'], ...Object.keys(CONFIG.CATEGORIAS)], '');
    $('f-estado').innerHTML = U.options([['', 'Todos los estados'], ...Object.keys(CONFIG.ESTADOS), ['__late', 'Revisión vencida']], '');
    $('f-tipo').innerHTML = U.options([['', 'Todos los tipos'], ...CONFIG.TIPOS], '');
    $('f-q').addEventListener('input', U.debounce(e => { filters.q = e.target.value; render(); }));
    $('f-q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; filters.q = ''; render(); } });
    [['f-year', 'year'], ['f-cat', 'cat'], ['f-estado', 'estado'], ['f-tipo', 'tipo']].forEach(([id, key]) =>
      $(id).addEventListener('change', e => { filters[key] = e.target.value; render(); }));
  }

  function setFilter(key, value) {
    filters[key] = value;
    const map = { year: 'f-year', cat: 'f-cat', estado: 'f-estado', tipo: 'f-tipo', q: 'f-q' };
    $(map[key]).value = value;
  }

  function clearFilters() {
    Object.keys(filters).forEach(k => setFilter(k, ''));
    render();
  }

  const passes = r =>
    (!filters.cat || r.categoria === filters.cat) &&
    (!filters.tipo || r.tipo === filters.tipo) &&
    (!filters.estado || (filters.estado === '__late' ? Store.isLate(r) : r.estado === filters.estado)) &&
    U.matches(filters.q, [r.codigo, r.especifico, r.categoria, r.capacidad !== null ? `${r.capacidad} ${r.unidad}` : '', r.tipo, r.estado, r.responsable, r.ubicacion, r.notas, U.fmtDate(r.fecha)]);

  function renderKpis() {
    const all = Store.all();
    const count = e => all.filter(r => r.estado === e).length;
    const late = all.filter(Store.isLate).length;
    const kpi = (cls, label, value, action) =>
      `<button type="button" class="kpi ${cls}" data-action="kpi" data-filter="${action}"><span class="kpi-label">${label}</span><span class="kpi-value">${value}</span></button>`;
    $('kpis').innerHTML =
      kpi('', 'Registros totales', all.length, '') +
      kpi('ok', 'Operativos', count('Operativo'), 'Operativo') +
      kpi('warn', 'En mantenimiento', count('En mantenimiento'), 'En mantenimiento') +
      kpi('info', 'Programados', count('Programado'), 'Programado') +
      kpi(`danger${late ? ' alert' : ''}`, 'Revisiones vencidas', late, '__late');
    const codigos = new Set(all.map(r => r.codigo)).size;
    $('subtitle').textContent = `${U.plural(codigos, 'herramienta o equipo', 'herramientas y equipos')} con ${U.plural(all.length, 'registro', 'registros')} en ${CONFIG.YEARS.join(' y ')}.`;
  }

  function row(r) {
    const q = filters.q;
    const late = Store.isLate(r);
    return `<tr class="${late ? 'row-late' : ''}">
      <td data-label="Fecha" class="nowrap">${U.fmtDate(r.fecha)}</td>
      <td data-label="Código"><span class="code">${U.highlight(r.codigo, q)}</span></td>
      <td data-label="Equipo">${U.highlight(r.especifico, q)}<small>${U.highlight(r.categoria, q)}</small></td>
      <td data-label="Capacidad" class="cap">${U.highlight(U.fmtCap(r), q)}</td>
      <td data-label="Tipo">${U.highlight(r.tipo, q)}</td>
      <td data-label="Estado"><span class="badge ${CONFIG.ESTADOS[r.estado] || 't-muted'}">${U.esc(r.estado)}</span></td>
      <td data-label="Responsable">${r.responsable ? U.highlight(r.responsable, q) : '<span class="muted">—</span>'}${r.ubicacion ? `<small>${U.highlight(r.ubicacion, q)}</small>` : ''}</td>
      <td data-label="Próxima revisión" class="nowrap">${r.proxima ? (late ? `<span class="badge plain t-danger">Vencida ${U.fmtDate(r.proxima)}</span>` : U.fmtDate(r.proxima)) : '<span class="muted">—</span>'}</td>
      <td class="actions">
        <button type="button" class="icon-btn" data-action="edit" data-id="${r.id}" aria-label="Editar ${U.esc(r.codigo)}" title="Editar">${U.icon('edit')}</button>
        <button type="button" class="icon-btn del" data-action="delete" data-id="${r.id}" aria-label="Eliminar ${U.esc(r.codigo)}" title="Eliminar">${U.icon('trash')}</button>
      </td>
    </tr>`;
  }

  function yearBlock(year, index) {
    const list = Store.byYear(year);
    const rows = list.filter(passes).sort((a, b) => b.fecha.localeCompare(a.fecha) || a.codigo.localeCompare(b.codigo));
    const n = e => list.filter(r => r.estado === e).length;
    const filtered = rows.length !== list.length;

    let content;
    if (!list.length) {
      content = `<div class="year-empty"><p>Aún no hay registros en ${year}.</p>
        <button type="button" class="btn btn-secondary" data-action="new" data-year="${year}">${U.icon('plus')}Agregar registro</button></div>`;
    } else if (!rows.length) {
      content = `<div class="year-empty"><p>Ningún registro de ${year} coincide con la búsqueda o los filtros.</p></div>`;
    } else {
      content = `<div class="table-wrap"><table class="records">
        <thead><tr><th>Fecha</th><th>Código</th><th>Equipo</th><th>Capacidad</th><th>Tipo</th><th>Estado</th><th>Responsable</th><th>Próxima revisión</th><th><span class="sr-only">Acciones</span></th></tr></thead>
        <tbody>${rows.map(row).join('')}</tbody></table></div>`;
    }

    return `<section class="year${index % 2 ? ' alt' : ''}" aria-labelledby="y-${year}">
      <header class="year-head">
        <h2 class="year-num" id="y-${year}">${year}</h2>
        <dl class="year-stats">
          <div><dt>Registros</dt><dd>${filtered ? `${rows.length}<span class="muted"> / ${list.length}</span>` : list.length}</dd></div>
          <div><dt>Operativos</dt><dd>${n('Operativo')}</dd></div>
          <div><dt>En mantenimiento</dt><dd>${n('En mantenimiento')}</dd></div>
          <div><dt>Programados</dt><dd>${n('Programado')}</dd></div>
        </dl>
        <button type="button" class="btn btn-secondary btn-small" data-action="new" data-year="${year}">${U.icon('plus')}Agregar en ${year}</button>
      </header>
      ${content}
    </section>`;
  }

  function render() {
    renderKpis();
    const years = filters.year ? [Number(filters.year)] : CONFIG.YEARS;
    $('years').innerHTML = years.map(y => yearBlock(y, CONFIG.YEARS.indexOf(y))).join('');
    const active = Object.values(filters).some(Boolean);
    const shown = years.reduce((a, y) => a + Store.byYear(y).filter(passes).length, 0);
    $('result-count').textContent = active ? `${U.plural(shown, 'resultado', 'resultados')}` : '';
    $('clear-filters').hidden = !active;
  }

  async function handleAction(el) {
    const action = el.dataset.action;
    if (action === 'new') RecordForm.open(null, Number(el.dataset.year) || null);
    if (action === 'edit') RecordForm.open(el.dataset.id);
    if (action === 'delete') {
      const r = Store.get(el.dataset.id);
      if (!r) return;
      const ok = await UI.confirm({ title: 'Eliminar registro', text: `Se eliminará el registro de <strong>${U.esc(r.codigo)}</strong> (${U.esc(r.especifico)}) del ${U.fmtDate(r.fecha)}.`, label: 'Eliminar' });
      if (ok) { Store.remove(r.id); render(); UI.toast('Registro eliminado'); }
    }
    if (action === 'kpi') {
      clearFilters();
      if (el.dataset.filter) setFilter('estado', el.dataset.filter);
      render();
      $('years').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (action === 'clear-filters') clearFilters();
    if (action === 'export') {
      const blob = new Blob([Store.exportJSON()], { type: 'application/json' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `respaldo-herramientas-${U.today()}.json` });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      UI.toast('Respaldo exportado');
    }
    if (action === 'demo') {
      const ok = !Store.all().length || await UI.confirm({ title: 'Cargar datos de ejemplo', text: 'Se reemplazarán los registros actuales. Exporta un respaldo si quieres conservarlos.', label: 'Reemplazar' });
      if (ok) { Store.loadDemo(); render(); UI.toast('Datos de ejemplo cargados'); }
    }
    if (action === 'clear') {
      const ok = await UI.confirm({ title: 'Borrar todos los datos', text: 'Se eliminarán todos los registros guardados en este navegador. Esta acción no se puede deshacer.', label: 'Borrar todo' });
      if (ok) { Store.clearAll(); render(); UI.toast('Datos borrados'); }
    }
    el.closest('details')?.removeAttribute('open');
  }

  function start() {
    Store.init();
    if (!Storage.available) $('storage-note').hidden = false;
    setupFilters();
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (el) handleAction(el);
      // Cierra el menú Datos al hacer clic fuera
      const menu = document.querySelector('.data-menu[open]');
      if (menu && !menu.contains(e.target)) menu.removeAttribute('open');
    });
    $('import-file').addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      document.querySelector('.data-menu')?.removeAttribute('open');
      if (!file) return;
      try { Store.importJSON(await file.text()); render(); UI.toast('Respaldo importado'); }
      catch (err) { UI.toast(err.message, 'danger'); }
    });
    render();
  }

  return { start, render };
})();

/* =========================================================
   9. ARRANQUE
   ========================================================= */
document.addEventListener('DOMContentLoaded', App.start);
</script>
</body>
</html>
